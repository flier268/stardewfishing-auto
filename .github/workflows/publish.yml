name: Publish JAR

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v3.2, v3.3, etc.
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write  # Required for creating releases

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Get version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep "mod_version=" gradle.properties | cut -d'=' -f2)
          echo "MOD_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Find JAR file
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" -type f | head -n 1)
          echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_PATH"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_jar.outputs.JAR_PATH }}
          name: Stardew Fishing v${{ steps.get_version.outputs.MOD_VERSION }}
          body: |
            ## Stardew Fishing v${{ steps.get_version.outputs.MOD_VERSION }}

            ### Installation
            1. Download the JAR file below
            2. Place it in your Minecraft mods folder
            3. Launch Minecraft with Forge ${{ env.FORGE_VERSION }}

            ### Compatibility
            - Minecraft: 1.20.1
            - Forge: 47.4.0+

            ### Changes
            See commit history for detailed changes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
